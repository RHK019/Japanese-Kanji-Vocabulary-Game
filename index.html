<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Japanese Kanji Game</title>

    <style>
        :root {
            --bg-color: #f7f9fa;
            --text-color: #3c3c3c;
            --primary-color: #58cc02;
            --primary-shadow: #46a302;
            --secondary-color: #1cb0f6;
            --secondary-shadow: #1899d6;
            --card-bg: #ffffff;

            /* Navbar colors */
            --nav-start: #171a3a;
            --nav-end: #29235c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            background: linear-gradient(
                135deg,
                var(--nav-start),
                var(--nav-end)
            );

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);

            z-index: 1000;
        }

        /* Logo */

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;

            color: white;
            text-decoration: none;

            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo-symbol {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);

            font-size: 1.05rem;
        }

        /* Menu button */

        .menu-wrapper {
            position: relative;
        }

        .menu-btn {
            width: 45px;
            height: 45px;

            border: none;
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.10);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }

        .menu-btn span {
            width: 22px;
            height: 2px;

            background: white;
            border-radius: 10px;

            transition: 0.25s ease;
        }

/* =========================
   SLIDE MENU
========================= */

/* Dark transparent background over the page */
.menu-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.30);

    opacity: 0;
    visibility: hidden;

    transition: 0.3s ease;

    z-index: 1998;
}

.menu-overlay.show {
    opacity: 1;
    visibility: visible;
}


/* Right side menu */

.menu-dropdown {
    position: fixed;

    top: 0;
    right: 0;

    width: 50vw;
    height: 100vh;

    padding: 100px 35px 40px;

    background: rgba(0, 0, 0, 0.70);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border-left: 1px solid rgba(255, 255, 255, 0.12);

    box-shadow: -10px 0 35px rgba(0, 0, 0, 0.25);

    transform: translateX(100%);

    transition: transform 0.35s ease;

    z-index: 1999;

    opacity: 1;
    visibility: visible;
}

.menu-dropdown.show {
    transform: translateX(0);
}


/* Menu links */

.menu-dropdown a {
    display: flex;
    align-items: center;

    padding: 15px 18px;
    margin-bottom: 10px;

    color: white;
    text-decoration: none;

    font-size: 1.05rem;
    font-weight: 600;

    border-radius: 12px;

    background: rgba(255, 255, 255, 0.06);

    transition: 0.2s ease;
}

.menu-dropdown a:hover {
    background: rgba(255, 255, 255, 0.14);

    transform: translateX(-4px);
}

.menu-icon {
    width: 32px;

    font-size: 1.1rem;

    color: white;
}


/* Close button */

.menu-btn.active span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
}

.menu-btn.active span:nth-child(2) {
    opacity: 0;
}

.menu-btn.active span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
}


/* Mobile */

@media (max-width: 600px) {

    .menu-dropdown {
        width: 50vw;
        padding: 90px 20px 30px;
    }

    .menu-dropdown a {
        padding: 13px 12px;
        font-size: 0.95rem;
    }
}


        /* =========================
           MAIN CONTENT

        .container {
            width: 100%;
            max-width: 500px;

        .game-btn:hover {

        .footer {

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .navbar {
                height: 64px;
                padding: 0 18px;
            }

            .nav-logo {
                font-size: 1.25rem;
            }

            .logo-symbol {
                width: 35px;
                height: 35px;
                border-radius: 10px;
            }

            .menu-btn {
                width: 42px;

            }

            .menu-dropdown {
                top: 54px;

            }

            .container {
                padding-top: 95px;
            }

            .card {
                padding: 30px 20px;
            }

            .logo {

            }

            h1 {
                font-size: 1.7rem;
            }

            .game-btn {
                font-size: 1.1rem;
                padding: 15px;
            }
        }
    </style>
</head>

<a

    <!-- =========================
         MENU JAVASCRIPT
    ========================= -->

<script>

    const menuButton = document.getElementById("menuButton");
    const menuDropdown = document.getElementById("menuDropdown");
    const menuOverlay = document.getElementById("menuOverlay");


    /* Open / Close Menu */

    menuButton.addEventListener("click", function () {

        menuDropdown.classList.toggle("show");
        menuOverlay.classList.toggle("show");
        menuButton.classList.toggle("active");

    });


    /* Click outside menu */

    menuOverlay.addEventListener("click", function () {

        menuDropdown.classList.remove("show");
        menuOverlay.classList.remove("show");
        menuButton.classList.remove("active");

    });


    /* Close menu after selecting an option */

    const menuLinks = menuDropdown.querySelectorAll("a");

    menuLinks.forEach(function (link) {

        link.addEventListener("click", function () {

            menuDropdown.classList.remove("show");
            menuOverlay.classList.remove("show");
            menuButton.classList.remove("active");

        });

    });

</script>
